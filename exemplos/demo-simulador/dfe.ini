; Demo SEM certificado real: o broker consulta o DFeSimulador (outro processo)
; em vez da SEFAZ, com um certificado de TESTE autoassinado (CNPJ 11222333000181).
; Roteiro completo: docs/guia-de-uso.md
; Caminhos relativos valem em relacao A PASTA DESTE ARQUIVO.

[dfe]
; O simulador so' e' aceito em homologacao (em producao o host recusa subir).
Ambiente=homologacao
SimuladorURL=http://127.0.0.1:9200
; Intervalos curtos SO' para a demo (na SEFAZ real o minimo e' 1 hora).
IntervaloBaseSegundos=10
TickSegundos=2
CursorPath=cursores.dat
PathSchemas=../../vendor/ACBr/Exemplos/ACBrDFe/Schemas/NFe

[broker]
Modo=embutido
BindAddress=127.0.0.1
Porta=5672
DataDir=broker

; Filas duraveis declaradas pelo host: acumulam mesmo sem consumidor conectado.
[fila:documentos]
RoutingKey=nfe.documento.#

[fila:eventos]
RoutingKey=nfe.evento.#

[certificado:matriz]
Provider=nfe
CnpjCpf=11222333000181
UF=RS
ArquivoPFX=../../tests/Integration/AcbrSim/cert-teste/valido.pfx
; certificado de TESTE, publico no repositorio -- nunca faca isto com um real
Senha=teste123
Ativo=true
ManifestacaoAutomatica=false
