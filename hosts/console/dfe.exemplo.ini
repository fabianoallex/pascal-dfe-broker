; pascal-dfe-broker -- exemplo de configuracao do host console.
; Copie para dfe.ini (ao lado do executavel) ou use --config <arquivo>.
; Caminhos relativos valem em relacao A PASTA DESTE ARQUIVO.

[dfe]
; producao ou homologacao. Os NSUs dos dois ambientes sao SEPARADOS na SEFAZ e o
; cursor nao distingue: ao trocar, aponte CursorPath para outro arquivo.
Ambiente=producao
CursorPath=cursores.dat
; XSDs oficiais da NFe (padrao: pasta "Schemas" ao lado do executavel)
;PathSchemas=Schemas
; a SEFAZ limita a 1 consulta/hora por CNPJ sem novidade -- nao baixe disto
;IntervaloBaseSegundos=3600
;TickSegundos=60

[broker]
; embutido = broker AMQP dentro deste processo; externo = RabbitMQ etc.
Modo=embutido
; quem pode conectar: 127.0.0.1 = so' esta maquina; 0.0.0.0 = a rede toda
; (nesse caso TROQUE Usuario/Senha)
BindAddress=127.0.0.1
Porta=5672
Usuario=guest
Senha=guest
; WAL do broker embutido. Padrao duravel: o cursor de NSU ja' avancou quando
; a mensagem entra na fila, entao uma fila transiente perderia documento num
; restart. "DataDir=" (vazio) desliga -- so' para teste.
DataDir=broker
; modo externo:
;Host=127.0.0.1
;VirtualHost=/

; Filas declaradas pelo proprio host, ligadas a exchange topic "dfe". SEM uma
; fila ligada o broker DESCARTA o que for publicado (pub/sub). Consumidores
; tambem podem declarar as suas filas em qualquer momento.
; Routing-key: <tipo>.<categoria>.<uf>.<cnpj>, ex. nfe.documento.sp.12345678000190
[fila:documentos]
RoutingKey=nfe.documento.#

[fila:eventos]
RoutingKey=nfe.evento.#

; Um bloco por certificado. So' um pode estar Ativo=true por CNPJ/UF.
[certificado:matriz]
Provider=nfe
CnpjCpf=12345678000199
UF=RS
ArquivoPFX=matriz.pfx
; prefira SenhaEnv a Senha: o arquivo de config nao deve guardar segredo
SenhaEnv=DFE_SENHA_MATRIZ
;Senha=
Ativo=true
; ciencia da operacao automatica ao receber cada documento; false = so' por
; comando na fila "dfe.comandos" (routing-key comando.manifestacao)
ManifestacaoAutomatica=false
